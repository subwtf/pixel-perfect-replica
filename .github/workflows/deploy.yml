name: Deploy Static to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install and Build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Create Index and Fallback
        run: |
          mkdir -p .output/public
          # Проверяем, какой файл сборки сгенерился в assets, и прописываем его в index.html
          JS_FILE=$(ls .output/public/assets/index-*.js 2>/dev/null | xargs basename || echo "index.js")
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pixel Perfect Replica</title><base href="/pixel-perfect-replica/"></head><body><div id="root"></div><script type="module" src="./assets/"></script></body></html>' > .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ".output/public"

  deploy:
    needs: build-and-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
